# Dyness Junior Box — Dashboard (v0.1.1)
# Einrichtung: siehe docs/HA-Dashboard.md
#
# Hinweis: Die Entitäten-IDs enthalten die S/N. Falls deine HA-Installation
# andere IDs vergeben hat (Einstellungen → Geräte & Dienste → Entitäten →
# Suche "dyness"), bitte dort nachsehen und die drei IDs hier anpassen.
title: Dyness
views:
  - title: Dyness Junior Box
    path: dyness
    cards:
      - type: entities
        title: Status
        entities:
          - entity: binary_sensor.dyness_junior_r07e8546681a0121_connection
            name: Verbindung (Box ↔ HA)
          - entity: sensor.dyness_junior_r07e8546681a0121_soc
            name: Akku (SOC, experimentell)
          - entity: sensor.dyness_junior_r07e8546681a0121_firmware
            name: Firmware

      - type: entities
        title: Steuerung
        entities:
          - entity: select.dyness_junior_r07e8546681a0121_mode
            name: Modus
          - entity: number.dyness_junior_r07e8546681a0121_power_limit
            name: Leistungsgrenze
            type: slider

      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            name: Lastpriorität
            icon: mdi:power-plug
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.dyness_junior_r07e8546681a0121_mode
              data:
                option: Lastpriorität
          - type: button
            name: Batteriepriorität
            icon: mdi:battery-charging
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.dyness_junior_r07e8546681a0121_mode
              data:
                option: Batteriepriorität
          - type: button
            name: Aus (Shutdown)
            icon: mdi:power-off
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.dyness_junior_r07e8546681a0121_mode
              data:
                option: Aus (Shutdown)
          - type: button
            name: Entladetiefe 95 %
            icon: mdi:battery-arrow-down
            tap_action:
              action: perform-action
              perform_action: dyness_junior.set_dod
              data:
                dod: 95

      - type: markdown
        content: |
          **Sicherheit:** Der Slider beginnt bei **150 W** — alles darunter
          behandelt die Box als „unbegrenzt“ (Akku-Leerlauf-Gefahr). Die Werte wirken
          auf die Gesamt-Ausgangsleistung; die Tasmota (192.168.178.119) zeigt
          ≈ Soll − ~14 W (150 → ~136 W). Die Box hat **kein Read-back**: Slider
          und Modus-Dropdown zeigen den zuletzt gesetzten Wert, nicht den
          tatsächlichen Zustand der Box. „Aus (Shutdown)“ schaltet die Box aus.

          **Nicht verbunden?** 1) AdGuard → Query Log: `logger.dyness.com` muss auf
          die HA-IP (.126) zeigen. 2) Box ~10 s stromlos machen (triggert sofort
          neuen Verbindungsversuch). 3) `homeassistant.log` nach
          „Dylink-Server lauscht“ durchsuchen.