# Nur die KARTEN (für HA-Roh-Editor) — kein title:/views:-Wrapper!
# Komplett-Version (title/views inklusive) für yaml-Modus/Installer: dashboard.yaml
      # ── Übersicht: Akku + Ausgang ──────────────────────────────────────
      - type: grid
        columns: 2
        square: true
        cards:
          - type: gauge
            entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_soc_experimentell
            name: Akku (SOC)
            min: 0
            max: 100
            unit: "%"
            severity:
              green: 30
              yellow: 15
              red: 5
          - type: gauge
            entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_ausgangsleistung
            name: Ausgang
            min: 0
            max: 800
            unit: W
            severity:
              green: 0
              yellow: 400
              red: 700

      # ── Messwerte ──────────────────────────────────────────────────────
      - type: entities
        title: Messwerte
        entities:
          - entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_spannung_experimentell
            name: Batteriespannung
          - entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_strom_experimentell
            name: Batteriestrom (negativ = Entladen)
          - entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_soh_experimentell
            name: Batterie-Gesundheit (SOH)
          - entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_firmware
            name: Firmware

      # ── Steuerung ──────────────────────────────────────────────────────
      - type: entities
        title: Steuerung
        entities:
          - entity: select.balkon_dyness_junior_box_r07e8546681a0121_modus
            name: Modus
          - entity: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
            name: Leistungsgrenze (klicken = Zahl eingeben)

      - type: grid
        columns: 5
        square: false
        cards:
          - type: button
            name: "150 W"
            tap_action:
              action: perform-action
              perform_action: number.set_value
              target:
                entity_id: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
              data:
                value: 150
          - type: button
            name: "200 W"
            tap_action:
              action: perform-action
              perform_action: number.set_value
              target:
                entity_id: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
              data:
                value: 200
          - type: button
            name: "300 W"
            tap_action:
              action: perform-action
              perform_action: number.set_value
              target:
                entity_id: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
              data:
                value: 300
          - type: button
            name: "500 W"
            tap_action:
              action: perform-action
              perform_action: number.set_value
              target:
                entity_id: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
              data:
                value: 500
          - type: button
            name: "800 W"
            tap_action:
              action: perform-action
              perform_action: number.set_value
              target:
                entity_id: number.balkon_dyness_junior_box_r07e8546681a0121_leistungsgrenze
              data:
                value: 800

      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            name: Lastpriorität
            icon: mdi:power-plug
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.balkon_dyness_junior_box_r07e8546681a0121_modus
              data:
                option: Lastpriorität
          - type: button
            name: Batteriepriorität
            icon: mdi:battery-charging
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.balkon_dyness_junior_box_r07e8546681a0121_modus
              data:
                option: Batteriepriorität
          - type: button
            name: Aus (Shutdown)
            icon: mdi:power-off
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.balkon_dyness_junior_box_r07e8546681a0121_modus
              data:
                option: Aus (Shutdown)
          - type: button
            name: Entladetiefe 95 %
            icon: mdi:battery-arrow-down
            tap_action:
              action: perform-action
              perform_action: dyness_junior.set_dod
              data:
                dod: 95

      # ── Diagnose ───────────────────────────────────────────────────────
      - type: entities
        title: Diagnose
        entities:
          - entity: binary_sensor.dyness_junior_box_r07e8546681a0121_verbindung
            name: Verbindung (Box ↔ HA)
          - entity: update.dyness_junior_box_local_update
            name: Integration-Update

      # ── Hinweise ───────────────────────────────────────────────────────
      - type: markdown
        content: |
          **Sicherheit:** Der Slider beginnt bei **150 W** — alles darunter
          behandelt die Box als „unbegrenzt“ (Akku-Leerlauf-Gefahr). Der Befehl
          geht **beim Loslassen** des Sliders raus (ein Befehl pro Ziehen).

          **Echter Box-Zustand:** Die Box meldet kein Modus-/Sollwert-Register
          in der Telemetrie (Stand v1.0.0, ausgemessen). Sie **quittiert** aber
          jeden Befehl — das Attribut `box_bestaetigung` an Modus und
          Leistungsgrenze zeigt die Uhrzeit der letzten Box-Bestätigung
          (91-78-ACK). „Noch keine“ = seit HA-Start noch kein Befehl gesendet.

          **Messwerte:** Ausgangsleistung = gemessener Box-Ausgang (≈ Tasmota).
          Spannung/Strom/SOC kommen live aus der Telemetrie (alle ~4–5 min).
          An wechselhaften Tagen (Wolken) schwanken die Werte stark — die Box
          regelt trotzdem auf die eingestellte Leistungsgrenze.

          **Nicht verbunden?** 1) AdGuard → Query Log: `logger.dyness.com` muss
          auf die HA-IP (.126) zeigen. 2) Box ~10 s stromlos machen (triggert
          sofort neuen Verbindungsversuch). 3) `homeassistant.log` nach
          „Dylink-Server lauscht“ durchsuchen.