            name: Integration-Update

      # ── Hinweise ───────────────────────────────────────────────────────
      - type: markdown
        content: |
          **Sicherheit:** Leistungsgrenze 150–800 W — alles darunter behandelt
          die Box als „unbegrenzt“ (Akku-Leerlauf-Gefahr). Jeder Befehl wird von
          der Box **quittiert** (Bestätigungs-Zeit siehe Attribut
          `box_bestaetigung` an Modus/Leistungsgrenze, Entwickler-Werkzeug „Entitäten“).

          **Modus-Logik (App-Semantik):**
          - **Lastpriorität + X W:** Box speist X W ein — PV zuerst, Fehlbetrag
            aus dem Akku, PV-Überschuss lädt den Akku.
          - **Batteriepriorität + X W:** Akku lädt mit bis zu X W; PV über X W
            geht ans Haus (Überschuss-Einspeisung; erfahrungsgemäß erst ab
            ~X + 150 W, weil die Box nur in ≥150-W-Schritten gegenrechnet).

          **Nicht verbunden?** 1) AdGuard → Query Log: `logger.dyness.com` muss
          auf die HA-IP (.126) zeigen. 2) Box ~10 s stromlos machen (triggert
          neuen Verbindungsversuch). 3) `homeassistant.log` nach
          „Dylink-Server lauscht“ durchsuchen.