# Nur die KARTEN (für HA-Roh-Editor) — kein title:/views:-Wrapper!
# Komplett-Version (title/views inklusive) für yaml-Modus/Installer: dashboard.yaml
      # ── Übersicht: Akku + Ausgang ──────────────────────────────────────
      - type: grid
        columns: 2
        square: true
        cards:
          - type: gauge
            entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_soc
            name: Akku (SOC)
            min: 0
            max: 100
            unit: "%"
            severity:
              green: 30
              yellow: 15
              red: 5
          - type: gauge
            entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_ausgangsleistung
            name: Ausgang
            min: 0
            max: 800
            unit: W
            severity:
              green: 0
              yellow: 400
              red: 700

      # ── Messwerte (live, Takt ~4–5 min) ────────────────────────────────
      - type: markdown
        content: >
          **Messwerte** (Gerät sendet alle ~4–5 min)

          - **Akku SOC:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_soc") }} %
            — Stand vor
            {{ (now().timestamp() - as_timestamp(states.sensor.balkon_dyness_junior_box_r07e8546681a0121_soc.last_updated)) | round(0) }}
            s
          - **Spannung:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_spannung") }} V ·
            **Strom:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_strom") }} A
            (negativ = Entladen)
          - **Batterie-Gesundheit:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_soh") }} %
            · **Ausgang:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_ausgangsleistung") }} W

