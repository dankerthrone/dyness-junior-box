# Nur die KARTEN (für HA-Roh-Editor) — kein title:/views:-Wrapper!
# Generiert aus docs/dashboard.yaml (tools/gen_dashboard_cards.py) — NICHT von Hand editieren.
- type: grid
  columns: 2
  square: true
  cards:
  - type: gauge
    entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_soc
    name: Akku (SOC)
    min: 0
    max: 100
    unit: '%'
    severity:
      green: 30
      yellow: 15
      red: 5
  - type: gauge
    entity: sensor.balkon_dyness_junior_box_r07e8546681a0121_ausgangsleistung
    name: Ausgang
    min: 0
    max: 800
    unit: W
    severity:
      green: 0
      yellow: 400
      red: 700
- type: markdown
  content: '**Modus (Box):**

    {% set ack = state_attr("select.balkon_dyness_junior_box_r07e8546681a0121_modus",
    "box_bestaetigung") %}

    {% set regs = state_attr("sensor.balkon_dyness_junior_box_r07e8546681a0121_soc",
    "register") %}

    {% set base = regs.get("0x1900") if regs else none %}

    * **Steuerung (Zeitplan):** {{ states("select.balkon_dyness_junior_box_r07e8546681a0121_modus")
    }}{% if ack %} — von der Box bestätigt {{ ack }}{% endif %}

    * **Basis-Modus (Box-Register 0x1900):** {% if base == 16 %}Lastpriorität{% elif
    base == 255 %}Aus (Shutdown){% elif base is not none %}Code {{ base }}{% else
    %}— (nicht im letzten Telegramm){% endif %}

    '
- type: markdown
  content: '**Messwerte** (Gerät sendet alle ~4–5 min)


    * **Akku SOC:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_soc")
    }} % — Stand vor {{ (now().timestamp() - as_timestamp(states.sensor.balkon_dyness_junior_box_r07e8546681a0121_soc.last_updated))
    | round(0) }} s

    * **Spannung:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_spannung")
    }} V · **Strom:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_strom")
    }} A (negativ = Entladen)

    * **Batterie-Gesundheit:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_soh")
    }} % · **Ausgang:** {{ states("sensor.balkon_dyness_junior_box_r07e8546681a0121_ausgangsleistung")
    }} W

    '
