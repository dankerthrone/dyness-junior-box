- type: markdown
  content: "**Sicherheit:** Leistungsgrenze 150–800 W — alles darunter behandelt\n\
    die Box als „unbegrenzt“ (Akku-Leerlauf-Gefahr). Jeder Befehl wird von\nder Box\
    \ **quittiert** (Bestätigungs-Zeit siehe Attribut\n`box_bestaetigung` an Modus/Leistungsgrenze,\
    \ Entwickler-Werkzeug „Entitäten“).\n\n**Modus-Logik (App-Semantik):**\n- **Lastpriorität\
    \ + X W:** Box speist X W ein — PV zuerst, Fehlbetrag\n  aus dem Akku, PV-Überschuss\
    \ lädt den Akku.\n- **Batteriepriorität + X W:** Akku lädt mit bis zu X W; PV\
    \ über X W\n  geht ans Haus (Überschuss-Einspeisung; erfahrungsgemäß erst ab\n\
    \  ~X + 150 W, weil die Box nur in ≥150-W-Schritten gegenrechnet).\n\n**Zwei Modus-Ebenen\
    \ (ausgemessen 02.11.):** „Steuerung (Zeitplan)“ =\nder Modus, den dieses Dashboard\
    \ setzt (Last-/Batterieprio/Aus; die Box\nbestätigt per Quittung). „Basis-Modus\
    \ (0x1900)“ = die Basis-Ebene aus\ndem SetBase-Einstellungsblock — die App schreibt\
    \ dort 16 (Lastprio)\nbzw. 255 (Aus). Steht Basis auf 255, läuft der Zeitplan\
    \ trotzdem weiter.\n\n**Nicht verbunden?** 1) AdGuard → Query Log: `logger.dyness.com`\
    \ muss\nauf die HA-IP (.126) zeigen. 2) Box ~10 s stromlos machen (triggert\n\
    neuen Verbindungsversuch). 3) `homeassistant.log` nach\n„Dylink-Server lauscht“\
    \ durchsuchen."
